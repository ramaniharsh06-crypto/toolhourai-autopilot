name: Tool Hour AI autopilot

on:
  schedule:
    - cron: "15 8 * * *"     # every day 13:45 India time, right after Gemini's free quota resets
  workflow_dispatch:           # "Run workflow" button for a manual run
    inputs:
      mode:
        description: "full = make + schedule · video-only = make, don't post · check = test API keys only"
        default: full
        type: choice
        options: [full, video-only, check]

permissions:
  contents: write
  issues: write

concurrency: autopilot

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache video tools
        id: toolcache
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: video-tools-v2
      - name: Install video tools (cached after first run)
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/tools/bin" "$HOME/.fonts"
          if [ ! -x "$HOME/tools/bin/ffmpeg" ]; then
            ok=0
            if curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ff.tar.xz \
                 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
              tar -xJf /tmp/ff.tar.xz -C /tmp && cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$HOME/tools/bin/" && ok=1
            fi
            if [ $ok = 0 ] && curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/ff2.tar.xz \
                 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
              tar -xJf /tmp/ff2.tar.xz -C /tmp && cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe "$HOME/tools/bin/" && ok=1
            fi
            if [ $ok = 0 ]; then
              sudo apt-get install -y -qq --no-install-recommends ffmpeg && ln -sf "$(command -v ffmpeg)" "$HOME/tools/bin/ffmpeg" && ok=1
            fi
            [ $ok = 1 ] || { echo "could not install ffmpeg"; exit 1; }
          fi
          [ -f "$HOME/tools/NotoColorEmoji.ttf" ] || curl -fsSL --retry 3 --connect-timeout 20 -o "$HOME/tools/NotoColorEmoji.ttf" \
               https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf || true
          cp "$HOME/tools/NotoColorEmoji.ttf" "$HOME/.fonts/" 2>/dev/null || true
          fc-cache -f >/dev/null 2>&1 || true
          echo "$HOME/tools/bin" >> "$GITHUB_PATH"
          "$HOME/tools/bin/ffmpeg" -version | head -1
      - name: Git identity
        run: |
          git config user.name "toolhourai-autopilot"
          git config user.email "actions@users.noreply.github.com"
      - name: Make today's video, schedule it, learn from past ones
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "check" ]; then python -u autopilot/check.py
          elif [ "$MODE" = "video-only" ]; then python -u autopilot/run.py --no-publish
          else python -u autopilot/run.py; fi
      - name: Keep the video-only test as a downloadable file
        if: always() && github.event.inputs.mode == 'video-only'
        uses: actions/upload-artifact@v4
        with: { name: test-video, path: docs/v/*.mp4, if-no-files-found: ignore }
      - name: Weekly report to your inbox (GitHub issue notification)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cat data/REPORT.md data/SCOUT.md > /tmp/weekly.md 2>/dev/null || true
            [ -s /tmp/weekly.md ] && gh issue create --title "Weekly report $(date -u +%F): performance + trend scout" --body-file /tmp/weekly.md || true
          fi
      - name: Tell you if something broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REASON="$(cat data/LAST_ERROR.txt 2>/dev/null || echo 'See the run log for details.')"
          gh issue create --title "⚠️ Autopilot did not finish $(date -u +%F)" --body "$REASON Run - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
